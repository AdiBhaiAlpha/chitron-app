name: Build Chitron's Archive Android APKs (Debug & Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore & Environment Files
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard Android debug.keystore..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ ! -f ".env.example" ]; then
            echo "ADMIN_PIN=2448766" > .env.example
          fi

          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Build Signed Debug & Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

          cp app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk ./app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ./app.apk
          ls -lh ./app-debug.apk ./app-release.apk ./app.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app-release.apk
          if-no-files-found: error

      - name: Upload Combined APKs Bundle
        uses: actions/upload-artifact@v4
        with:
          name: chitrons-archive-apks
          path: |
            app-debug.apk
            app-release.apk
            app.apk
          if-no-files-found: error

name: Build Chitron's Archive Android APKs (Debug & Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Universal Keystore (Valid 2020-2054) & Environment Files
        run: |
          # Use a fixed keystore whose certificate startdate is 2020/01/01 (preventing future-date CertificateNotYetValidException on devices)
          UNIVERSAL_KS_B64=""
          echo "$UNIVERSAL_KS_B64" | base64 -d > debug.keystore
          keytool -list -v -keystore debug.keystore -storepass android | head -n 15

          if [ ! -f ".env.example" ]; then
            echo "ADMIN_PIN=2448766" > .env.example
          fi

          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Build, Align & Sign Debug and Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ZIPALIGN=$(find "$ANDROID_SDK_ROOT/build-tools" -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)

          "$ZIPALIGN" -p -f 4 app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
          "$APKSIGNER" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            ./app-debug.apk
          "$APKSIGNER" verify --min-sdk-version 21 -v ./app-debug.apk

          "$ZIPALIGN" -p -f 4 app/build/outputs/apk/release/app-release.apk ./app-release.apk
          "$APKSIGNER" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            ./app-release.apk
          "$APKSIGNER" verify --min-sdk-version 21 -v ./app-release.apk

          cp ./app-release.apk ./app.apk
          ls -lh ./app-debug.apk ./app-release.apk ./app.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app-release.apk
          if-no-files-found: error

      - name: Upload Combined APKs Bundle
        uses: actions/upload-artifact@v4
        with:
          name: chitrons-archive-apks
          path: |
            app-debug.apk
            app-release.apk
            app.apk
          if-no-files-found: error

      - name: Publish Direct Download APKs to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Chitron's Archive Android APK (Direct Download)"
          body: "Direct installable Android APKs (signed with v1 + v2 + v3 schemes, valid 2020–2054). Tap **app-release.apk** or **app-debug.apk** below to download directly without unzipping."
          prerelease: false
          files: |
            app-release.apk
            app-debug.apk
            app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
